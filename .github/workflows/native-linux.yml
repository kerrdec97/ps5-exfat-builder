name: Native (C++) Linux tests with sanitizers

# Builds native/ on Ubuntu with GCC and AddressSanitizer + UBSan and runs every
# automated test (the GUI tests use the offscreen platform). Complements the
# Windows workflow: memory and undefined-behaviour bugs show up here first.

on:
  push:
    branches: [farewell-edition-dev, 'claude/wizardly-sagan-mahxhj']
    paths:
      - 'native/**'
      - '.github/workflows/native-linux.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and Qt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build qt6-base-dev qt6-base-dev-tools libqt6svg6-dev \
            libgl1-mesa-dev zlib1g-dev exfatprogs fonts-dejavu-core

      - name: Configure (ASan + UBSan)
        run: >
          cmake -S native -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build --parallel

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure --timeout 900
