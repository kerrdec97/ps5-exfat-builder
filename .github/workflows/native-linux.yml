name: Native (C++) Linux tests with sanitizers

# Builds native/ on Ubuntu with GCC and AddressSanitizer + UBSan and runs every
# automated test (the GUI tests use the offscreen platform). Complements the
# Windows workflow: memory and undefined-behaviour bugs show up here first.

# Started by hand only (Actions > Run workflow). Ubuntu 24.04 ships Qt 6.4, not
# the Qt 6.10.3 the Windows release is built with: this job checks the code for
# memory and undefined-behaviour bugs, it does not test the shipped Qt. It is
# not run for pull requests until it has been brought up to date with v5 (last
# green run: 2026-11-04).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install toolchain and Qt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build qt6-base-dev qt6-base-dev-tools libqt6svg6-dev \
            libgl1-mesa-dev zlib1g-dev exfatprogs fonts-dejavu-core fonts-inter libqt6sql6-sqlite unzip

      - name: Configure (ASan + UBSan)
        run: >
          cmake -S native -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build --parallel

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/native/tests/lsan.supp
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          FW_OFFLINE: '1'
          FW_NO_POWER_ACTIONS: '1'
        run: ctest --test-dir build --output-on-failure --timeout 900
