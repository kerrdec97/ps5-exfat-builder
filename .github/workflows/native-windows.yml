name: Native (C++) Windows build and test

# Builds the native Farewell Edition (native/) with MSVC 2022 + Qt 6.8 on
# Windows, runs the automated tests, deploys the Qt runtime, packages a portable
# zip and an installer, launches the real .exe (self-test, page screenshots,
# 30 s alive check) and uploads everything as evidence. Nothing is published.

on:
  push:
    branches: [farewell-edition-dev, 'claude/wizardly-sagan-mahxhj']
    paths:
      - 'native/**'
      - '!native/docs/**'
      - '!native/**/*.md'
      - '.github/workflows/native-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      QT_VERSION: '6.8.3'
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: cmake -S native -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFW_WARNINGS_AS_ERRORS=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build --parallel

      - name: Automated tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          FW_OFFLINE: '1'
          # The runner is an administrator: mount VHDs to test against the real Windows exFAT driver.
          FW_WINDOWS_MOUNT_TEST: '1'
        run: |
          New-Item -ItemType Directory -Force ci-out | Out-Null
          ctest --test-dir build --timeout 900 --output-junit "$PWD\ci-out\ctest-junit.xml" 2>&1 | Tee-Object ci-out\ctest.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # Show every failing test's own output (PowerShell piping hides it above).
            $failed = Select-String -Path ci-out\ctest.txt -Pattern '\d+ - (\S+) \(' | ForEach-Object { $_.Matches[0].Groups[1].Value }
            foreach ($t in $failed) {
              Write-Host "===== $t ====="
              $exe = Get-ChildItem -Recurse build\tests -Filter "$t.exe" | Select-Object -First 1
              if ($exe) {
                $log = Join-Path $PWD "ci-out\$t.log"
                Push-Location $exe.DirectoryName
                & $exe.FullName -o "$log,txt" -maxwarnings 0 | Out-Null
                $rc = $LASTEXITCODE
                Pop-Location
                Get-Content $log | Where-Object { $_ -notmatch '^PASS' } | Out-Host
                Write-Host "exit code: $rc"
              }
            }
            throw "ctest failed ($code)"
          }

      - name: Evidence of the real Windows exFAT driver test
        if: success() || failure()
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          FW_OFFLINE: '1'
          FW_WINDOWS_MOUNT_TEST: '1'
        run: |
          # Prints every check (mount, read back, chkdsk, Windows-formatted image read natively), not just pass/fail.
          New-Item -ItemType Directory -Force ci-out | Out-Null
          $log = Join-Path $PWD 'ci-out\tst_exfat_windows.txt'
          $exe = Get-ChildItem -Recurse build\tests -Filter 'tst_exfat_windows.exe' | Select-Object -First 1
          Push-Location $exe.DirectoryName
          & $exe.FullName -v1 -o "$log,txt" | Out-Null
          Pop-Location
          Get-Content $log

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          $dist = "dist\exFAT Image Builder"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item "build\bin\exFAT Image Builder.exe" $dist
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw --compiler-runtime "$dist\exFAT Image Builder.exe"
          Copy-Item native\packaging\README-portable.txt "$dist\README.txt"
          Copy-Item LICENSES -Recurse "$dist\LICENSES"
          Copy-Item native\packaging\licenses\* "$dist\LICENSES\"
          Copy-Item native\packaging\THIRD_PARTY_NOTICES-native.md "$dist\THIRD_PARTY_NOTICES.md"
          Get-ChildItem $dist -Recurse | Measure-Object -Property Length -Sum | Select-Object Count, Sum | Tee-Object ci-out\dist-size.txt

      - name: Self-test of the deployed exe
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist\exFAT Image Builder\exFAT Image Builder.exe'
          $env:FW_DATA_DIR = Join-Path $PWD 'ci-data'
          $env:FW_OFFLINE = '1'
          $p = Start-Process -FilePath $exe -ArgumentList '--self-test' -RedirectStandardOutput ci-out\self-test.json -RedirectStandardError ci-out\self-test.err -PassThru -Wait -NoNewWindow
          Get-Content ci-out\self-test.json
          if ($p.ExitCode -ne 0) { throw "self-test exit code $($p.ExitCode)" }

      - name: Screenshot every page with the deployed exe
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist\exFAT Image Builder\exFAT Image Builder.exe'
          $env:FW_DATA_DIR = Join-Path $PWD 'ci-data'
          $env:FW_OFFLINE = '1'
          $p = Start-Process -FilePath $exe -ArgumentList '--screenshot-pages', (Join-Path $PWD 'ci-out\pages') -RedirectStandardOutput ci-out\screenshots.txt -PassThru -Wait -NoNewWindow
          Get-Content ci-out\screenshots.txt
          if ($p.ExitCode -ne 0) { throw "screenshot run exit code $($p.ExitCode)" }

      - name: Launch the deployed exe (alive after 30 s)
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist\exFAT Image Builder\exFAT Image Builder.exe'
          $env:FW_DATA_DIR = Join-Path $PWD 'ci-data'
          $env:FW_OFFLINE = '1'
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 30
          $alive = -not $p.HasExited
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save((Join-Path $PWD 'ci-out\desktop-launch.png'))
          Get-Process | Where-Object { $_.ProcessName -like 'exFAT Image Builder*' } |
            Select-Object ProcessName, Id, WorkingSet64, CPU | Format-Table | Out-String | Tee-Object ci-out\processes.txt
          if ($alive) { Stop-Process -Id $p.Id -Force } else { "exit code: $($p.ExitCode)" | Tee-Object ci-out\exit.txt }
          Copy-Item -Recurse ci-data ci-out\ci-data -ErrorAction SilentlyContinue
          if (-not $alive) { throw "The executable exited within 30 seconds" }

      - name: Package portable zip and installer
        shell: pwsh
        run: |
          $ver = (Select-String -Path native\CMakeLists.txt -Pattern 'VERSION (\d+\.\d+\.\d+)').Matches[0].Groups[1].Value
          Compress-Archive -Path "dist\exFAT Image Builder" -DestinationPath "dist\exFAT-Image-Builder-Farewell-$ver-win64-portable.zip" -Force
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $inno = 'C:\Program Files (x86)\Inno Setup 6'
            if (-not (Test-Path "$inno\ISCC.exe")) { choco install innosetup --no-progress -y | Out-Null }
            $env:PATH = "$inno;$env:PATH"
          }
          iscc /DAppVersion=$ver /DSourceDir="$PWD\dist\exFAT Image Builder" /O"$PWD\dist" native\packaging\installer.iss
          Get-ChildItem dist -File | ForEach-Object {
            (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLower() + "  " + $_.Name
          } | Tee-Object dist\SHA256SUMS.txt

      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-packages
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: warn

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-evidence
          path: ci-out/
          if-no-files-found: warn
