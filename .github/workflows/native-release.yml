name: Native (C++) release

# Pushing a tag v5.* builds, tests and packages exFAT Image Builder v5 on
# Windows (native-windows.yml, called from here), then publishes the
# single-file exe (the one download: nothing to unzip or install) and
# SHA256SUMS.txt as a GitHub *pre-release*. A release that already exists for
# the tag (the owner publishes by hand) is left as it is. A pre-release is not
# "latest"; promote it by hand once it has been tested on a real PC and
# console. The installer and the portable zip stay build artefacts of the
# Windows workflow; they are not part of a release.

on:
  push:
    tags: ['v5.*']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/native-windows.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: native-windows-packages
          path: dist

      - name: Check the download against its checksum
        run: |
          ls -la dist
          # GitHub serves the asset without spaces; SHA256SUMS.txt lists that name.
          cp "dist/exFAT Image Builder.exe" dist/exFAT.Image.Builder.exe
          cd dist && sha256sum -c SHA256SUMS.txt

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release published by hand (the owner uploads the exe himself) is left as it is.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The release $GITHUB_REF_NAME already exists (published by hand); not replacing it."
            exit 0
          fi
          # The asset is "exFAT.Image.Builder.exe"; the label keeps the readable name.
          gh release create "$GITHUB_REF_NAME" \
            "dist/exFAT.Image.Builder.exe#exFAT Image Builder.exe (single file: download and run)" \
            dist/SHA256SUMS.txt \
            --prerelease --verify-tag \
            --title "exFAT Image Builder ${GITHUB_REF_NAME#v} (pre-release)" \
            --notes-file native/RELEASE_NOTES.md
